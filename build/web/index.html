<!DOCTYPE html>
<html>
<head>
    <title>Personal Profile Form</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: "Segoe UI", Arial, sans-serif;
            background: linear-gradient(135deg, #b8eacb, #dff5e8);
        }

        .card {
            width: 600px;
            margin: 60px auto;
            background: #ffffff;
            border-radius: 18px;
            padding: 40px 50px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            color: #2e7d63;
            margin-bottom: 35px;
            font-size: 28px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #2e7d63;
            font-weight: 600;
            font-size: 16px;
        }

        input, textarea {
            width: 100%;
            padding: 14px;
            margin-bottom: 25px;
            border-radius: 14px;
            border: 1.5px solid #a7e1c3;
            background-color: #eefcf4;
            font-size: 15px;
            outline: none;
        }

        input:focus, textarea:focus {
            border-color: #2e7d63;
            background-color: #ffffff;
        }

        textarea {
            height: 90px;
            resize: none;
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #2e7d63, #3fae84);
            border: none;
            border-radius: 14px;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .link {
            text-align: center;
            margin-top: 20px;
        }

        .link a {
            text-decoration: none;
            color: #2e7d63;
            font-weight: 600;
        }
    </style>
</head>

<body>

<div class="card">
    <h2>Personal Profile Form</h2>

    <form action="ProfileServlet" method="post">
        <label>Name</label>
        <input type="text" name="name" required>

        <label>Student ID</label>
        <input type="text" name="studentId" required>

        <label>Program</label>
        <input type="text" name="programme">

        <label>Email</label>
        <input type="email" name="email">

        <label>Hobbies</label>
        <input type="text" name="hobbies">

        <label>Self Introduction</label>
        <textarea name="introduction"></textarea>

        <button type="submit">Submit Profile</button>
    </form>

    <div class="link">
        <a href="viewProfiles.jsp">View All Profiles</a>
    </div>
</div>

</body>
</html>
